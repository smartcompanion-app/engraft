name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Superseded runs on the same branch are pointless once a newer commit exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # Static checks only — no build, no subprocess tests — so this reports back
  # long before the test matrix finishes.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` builds first: the e2e project drives dist/cli.js as a
      # subprocess, so it tests the artefact users actually install.
      - name: Run tests
        run: npm test

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Catches a broken `bin`, a missing `files` entry or an unresolvable
      # entry point before it reaches npm rather than after.
      - name: Check the publishable package
        run: npm run check:publish

      # The published tarball is what a consumer gets: install it the way they
      # would and confirm the binary actually runs. This is the check that
      # would have caught the npm-bin symlink no-op in v0.2.1.
      - name: Smoke-test the packed tarball
        run: |
          npm pack --pack-destination /tmp
          npm install -g /tmp/smartcompanion-engraft-*.tgz
          engraft --version
